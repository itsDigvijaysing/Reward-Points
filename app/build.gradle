plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.devtools.ksp'
}

// Load release signing config from keystore.properties if present (gitignored).
// Falls back to debug signing so unconfigured machines can still build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystoreProperties.getProperty('storeFile') != null

android {
    namespace 'com.rewardpoints.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.rewardpoints.app"
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName "3.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        vectorDrawables {
            useSupportLibrary true
        }

        // Room schema export
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
        }
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2025.03.01')
    implementation composeBom
    androidTestImplementation composeBom

    // Compose
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Core Android
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.activity:activity-compose:1.10.1'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.9.0'

    // Room
    implementation 'androidx.room:room-runtime:2.7.1'
    implementation 'androidx.room:room-ktx:2.7.1'
    ksp 'androidx.room:room-compiler:2.7.1'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.1.4'

    // Encrypted storage for API tokens
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Backdrop blur (glass effect on cards + bottom bar).
    // Real GPU blur on API 31+; auto-falls-back to a translucent scrim on older devices.
    implementation 'dev.chrisbanes.haze:haze:1.7.2'
    implementation 'dev.chrisbanes.haze:haze-materials:1.7.2'

    // Markdown rendering for AI chat bubbles. Backed by Markwon (View-interop), so it does
    // not bring its own Compose UI version and is safe with Compose BOM 2025.03.01.
    // Published on JitPack — see settings.gradle for the repo entry.
    implementation 'com.github.jeziellago:compose-markdown:0.7.2'

    // Koin DI
    implementation 'io.insert-koin:koin-android:3.5.6'
    implementation 'io.insert-koin:koin-androidx-compose:3.5.6'

    // Ktor Client
    implementation 'io.ktor:ktor-client-core:3.1.2'
    implementation 'io.ktor:ktor-client-android:3.1.2'
    implementation 'io.ktor:ktor-client-content-negotiation:3.1.2'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.1.2'

    // Kotlinx Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'

    // Coil for images
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // WorkManager for background sync
    implementation 'androidx.work:work-runtime-ktx:2.10.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}